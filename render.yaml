# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
# A single web service: NestJS serves the API under /api and the built React app at /.
# The database is Supabase Postgres; paste its Session pooler URI as DATABASE_URL.
services:
  - type: web
    name: lifthours
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false # Supabase → Connect → Session pooler URI, ending in ?sslmode=no-verify
      - key: GEMINI_API_KEY
        sync: false # optional, free key from https://aistudio.google.com/apikey
      - key: GOOGLE_CALENDAR_ID
        sync: false # optional, the host's calendar, e.g. their Gmail address
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false # optional, service-account JSON key (see README → Google Calendar)
      - key: APP_TIMEZONE
        value: Europe/London
      - key: HOST_NAME
        value: Alex, AI Coach
      - key: SEED_DEMO
        value: "true"
